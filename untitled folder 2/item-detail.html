<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Lane | Item Details</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="panel hero-panel">
        <div class="hero-copy">
          <p class="eyebrow">Detail page</p>
          <h1 id="detailTitle">Trip item detail</h1>
          <p id="detailSubtitle" class="hero-text">Full item information and future price estimate.</p>
        </div>
        <div class="hero-actions">
          <button class="ghost-button" type="button" onclick="window.history.back()">Back</button>
          <a class="ghost-button" href="./results.html">Results page</a>
        </div>
      </header>

      <main id="itemDetailRoot" class="dashboard-grid detail-layout"></main>
    </div>

    <button id="georgeToggle" class="george-toggle" type="button">
      <span>George</span>
      <small>Assistant is awake</small>
    </button>

    <section id="georgePanel" class="george-panel hidden" aria-live="polite">
      <div class="george-header">
        <div>
          <p class="eyebrow">Ambient assistant</p>
          <h2>George</h2>
        </div>
        <button id="closeGeorge" class="icon-button" type="button">×</button>
      </div>
      <div id="georgeMessages" class="george-messages"></div>
      <div id="packingListPanel" class="packing-list-panel hidden">
        <div class="packing-header">
          <h3>Packing list</h3>
          <p>George keeps this with you across pages.</p>
        </div>
        <div id="packingListItems" class="packing-list-items"></div>
      </div>
      <div class="quick-prompts">
        <button class="chip-button" data-prompt="Explain this result in simple words" type="button">Explain this</button>
        <button class="chip-button" data-prompt="Why might this price change soon?" type="button">Price change</button>
        <button class="chip-button" data-prompt="Create a packing list for this trip" type="button">Packing list</button>
      </div>
      <form id="georgeForm" class="george-form">
        <input id="georgeInput" type="text" placeholder="Ask George about this item or any simple question" autocomplete="off" />
        <button class="primary-button" type="submit">Send</button>
      </form>
    </section>

    <script src="./frontend/shared.js"></script>
    <script src="./frontend/detail.js"></script>
  </body>
</html>
